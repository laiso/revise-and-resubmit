<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Revise &amp; Resubmit — 理解が積み上がるのを見る</title>
<style>
  :root {
    --ink: #1f1f1c;
    --muted: #7a7a72;
    --faint: #b9b9b0;
    --line: #e3e2da;
    --paper: #fbfaf6;
    --card: #ffffff;
    --focus: #f3efe2;
    --exit: #b3261e;
    --changed: #8a6a12;
    --link: #2a5db0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.8 -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
    padding: .7rem 1.1rem;
    background: rgba(251,250,246,.94);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  header .grow { flex: 1; }
  .meta { font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); margin-right: .35rem; vertical-align: middle; }
  .dot.on { background: #2e7d32; }
  .dot.off { background: var(--exit); }
  main { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 0; align-items: stretch; }
  /* 左右はそれぞれのスクロール容器。追従するのは右だけで、左は「今そこ」を保つ。 */
  .pane { padding: 1.1rem 1.1rem 2rem; min-width: 0; height: calc(100vh - 9.5rem); overflow-y: auto; }
  .pane.left { border-right: 1px solid var(--line); }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; }
    .pane { height: auto; max-height: none; overflow: visible; }
  }
  .pane h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 .8rem; font-weight: 600; }
  .chunk { white-space: pre-wrap; word-break: break-word; margin: 0 0 .35rem; padding: .35rem .5rem; border-left: 3px solid transparent; color: var(--faint); }
  .chunk.current { color: var(--ink); background: var(--focus); border-left-color: var(--ink); }
  .ahead { color: var(--faint); font-size: 13px; padding: .35rem .5rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .7rem .8rem; margin: 0 0 .6rem; }
  .card.changed { border-color: var(--changed); box-shadow: inset 3px 0 0 var(--changed); }
  .card.exit { border-color: var(--exit); box-shadow: inset 3px 0 0 var(--exit); }
  .card .no { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card .tag { font-size: 11px; font-weight: 600; margin-left: .4rem; }
  .card.changed .tag { color: var(--changed); }
  .card .body { margin: .25rem 0 0; white-space: pre-wrap; word-break: break-word; }
  .badge { font-size: 11px; font-weight: 700; color: #fff; background: var(--exit); border-radius: 999px; padding: .05rem .5rem; }
  footer { grid-column: 1 / -1; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; padding: 1rem 1.1rem 3rem; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  a { color: var(--link); }
  code { font-size: 12px; background: #f1f0ea; padding: .1rem .3rem; border-radius: 4px; }
  button { font: inherit; font-size: 12px; padding: .25rem .6rem; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; color: var(--ink); }
  button.danger { color: var(--exit); border-color: #e7c9c6; }
  .status-pill { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: .05rem .5rem; background: #fff; }
  .banner { grid-column: 1 / -1; margin: 0; padding: .6rem 1.1rem; background: #fdf3f2; color: var(--exit);
            border-bottom: 1px solid #e7c9c6; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 id="title">原稿</h1>
  <span class="meta" id="progress">読んでいます… 0/0</span>
  <span class="status-pill" id="status">queued</span>
  <span class="grow"></span>
  <span class="meta"><span class="dot" id="dot"></span><span id="conn">接続中…</span></span>
</header>

<main>
  <p id="banner" class="banner" hidden></p>
  <section class="pane left">
    <h2>今読んでいるところ</h2>
    <div id="manuscript"></div>
  </section>
  <section class="pane">
    <h2>🐕 mind-tail</h2>
    <div id="log"></div>
  </section>
  <footer>
    <span>この画面のURLは未発表原稿を開く鍵です。共有しないでください。</span>
    <span class="grow"></span>
    <a id="result" href="#">結果ページ（引用と指摘）</a>
    <a id="json" href="#" target="_blank" rel="noreferrer">状態JSON</a>
    <button class="danger" id="delete">この Run を削除</button>
  </footer>
</main>

<script>
(function () {
  "use strict";
  var TOKEN = "__TOKEN__";
  var SUBSTANTIVE = /修正[：:]\s*(?!\s*(なし|無し|特に\s*なし|とくに\s*なし|－|—|-)\s*$)/;

  var entries = [];
  var total = 0;
  var status = "queued";
  // 止まった理由。サーバーが言い切れたときだけ入る。
  var reason = "";
  var socket = null;
  var attempt = 0;
  var stick = true;
  var lastIdx = -1;

  var el = {
    title: document.getElementById("title"),
    progress: document.getElementById("progress"),
    status: document.getElementById("status"),
    dot: document.getElementById("dot"),
    conn: document.getElementById("conn"),
    manuscript: document.getElementById("manuscript"),
    log: document.getElementById("log"),
    json: document.getElementById("json"),
    result: document.getElementById("result"),
    banner: document.getElementById("banner"),
    del: document.getElementById("delete")
  };

  function isChanged(text) {
    var match = text.match(/修正[：:]\s*([\s\S]*)$/);
    if (!match) return false;
    var value = match[1].trim();
    if (!value) return false;
    return !/^(なし|無し|特になし|とくになし|－|—|-)/.test(value) && SUBSTANTIVE.test(text);
  }

  function line(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    node.textContent = text;
    return node;
  }

  // 最後に記録が増えた時刻。止まっているのか遅いだけなのかを画面で分けるため。
  var lastChange = Date.now();
  var lastCount = -1;

  function sinceLabel() {
    var seconds = Math.floor((Date.now() - lastChange) / 1000);
    if (seconds < 20) return "";
    if (seconds < 120) return "（" + seconds + "秒 更新なし）";
    return "（" + Math.floor(seconds / 60) + "分 更新なし）";
  }

  function render() {
    if (entries.length !== lastCount) {
      lastCount = entries.length;
      lastChange = Date.now();
    }
    var done = status === "complete" || status === "stopped";
    var waiting = done || status === "errored" ? "" : " " + sinceLabel();
    el.progress.textContent =
      (done ? "読み終わり " : status === "errored" ? "中断 " : "読んでいます… ") +
      entries.length + "/" + total + waiting;
    el.status.textContent = status;
    // 止まったときは、理由が画面に出ていることをはっきりさせる。サーバーが
    // 理由を言えたならそれを出す。0件でも「読者を呼べていない」とは限らない
    // （実行そのものが中断された場合があり、そのときは読者は呼ばれている）。
    el.banner.hidden = status !== "errored";
    if (status === "errored") {
      el.banner.textContent = reason
        ? "この Run は止まりました：" + reason + (entries.length ? " 原稿とログは残っています。" : "")
        : entries.length
          ? "この Run は途中で止まりました（下の記録に理由があります）。原稿とログは残っています。"
          : "この Run は始まる前に止まりました。読者を呼べていません。";
    }
    el.json.href = "/api/runs/" + TOKEN + "/state";
    el.result.href = "/r/" + TOKEN + "/result";

    el.manuscript.replaceChildren();
    entries.forEach(function (entry, index) {
      var current = index === entries.length - 1 && status !== "complete" && status !== "stopped";
      el.manuscript.appendChild(line("p", "chunk" + (current ? " current" : ""), entry.text));
    });
    el.manuscript.appendChild(line("p", "ahead", entries.length >= total ? "" : "（この先はまだ見えない）"));

    el.log.replaceChildren();
    entries.forEach(function (entry) {
      var changed = entry.stop ? false : isChanged(entry.entry);
      var card = document.createElement("div");
      card.className = "card" + (changed ? " changed" : "") + (entry.stop ? " exit" : "");
      var head = document.createElement("div");
      head.appendChild(line("span", "no", String(entry.idx + 1)));
      if (changed) head.appendChild(line("span", "tag", "↻ 理解が変わった"));
      if (entry.stop) head.appendChild(line("span", "badge", "離脱"));
      if (entry.model) head.appendChild(line("span", "no", "  " + entry.model));
      card.appendChild(head);
      card.appendChild(line("p", "body", entry.entry));
      el.log.appendChild(card);
    });
  }

  function scroller() {
    var pane = el.log.parentElement;
    return pane && pane.scrollHeight > pane.clientHeight + 4 ? pane : null;
  }

  function nearBottom() {
    var pane = scroller();
    if (pane) return pane.scrollHeight - pane.scrollTop - pane.clientHeight < 120;
    return window.innerHeight + window.scrollY >= document.body.scrollHeight - 120;
  }

  function onScroll() { stick = nearBottom(); }
  window.addEventListener("scroll", onScroll, { passive: true });
  el.log.parentElement.addEventListener("scroll", onScroll, { passive: true });

  function follow() {
    if (!stick) return;
    var pane = scroller();
    if (pane) pane.scrollTop = pane.scrollHeight;
    else window.scrollTo({ top: document.body.scrollHeight });
  }

  /** 左は「今そこ」を保つ。追従するのは右のペインだけ。 */
  function keepCurrentVisible() {
    var pane = el.manuscript.parentElement;
    var current = el.manuscript.querySelector(".chunk.current");
    if (!pane || !current || pane.scrollHeight <= pane.clientHeight + 4) return;
    pane.scrollTop = current.offsetTop - pane.clientHeight / 2 + current.clientHeight / 2;
  }

  /** 見出しは提示済みの最初の断片から取る（未提示の本文は受け取っていない）。 */
  function setTitle() {
    if (el.title.dataset.set === "1" || !entries.length) return;
    var line = (entries[0].text || "").split("\n").filter(function (value) { return value.trim(); })[0] || "";
    var title = line.replace(/^#+\s*/, "").trim();
    if (!title) return;
    el.title.textContent = title.length > 60 ? title.slice(0, 60) + "…" : title;
    el.title.dataset.set = "1";
  }

  function apply(message) {
    if (message.type === "snapshot") {
      entries = message.entries || [];
      total = message.total || 0;
      status = message.status || "queued";
      reason = message.reason || "";
      lastIdx = entries.length ? entries[entries.length - 1].idx : -1;
    } else if (message.type === "append") {
      var incoming = (message.entries || [])[0];
      total = message.total || total;
      status = message.status || status;
      if (incoming) {
        // 1件でも取りこぼしたら、差分で埋めずに snapshot で取り直す。
        // 配信の push は落ちうる（DO が起き直した直後など）ので、画面は自分で直す。
        if (lastIdx >= 0 && incoming.idx > lastIdx + 1) {
          requestSnapshot();
          return;
        }
        entries = entries.filter(function (entry) { return entry.idx !== incoming.idx; });
        entries.push(incoming);
        entries.sort(function (a, b) { return a.idx - b.idx; });
        lastIdx = incoming.idx;
      }
    } else if (message.type === "status") {
      status = message.status || status;
      reason = message.reason || "";
    } else if (message.type === "gone") {
      status = "deleted";
    }
    render();
    setTitle();
    keepCurrentVisible();
    follow();
  }

  function requestSnapshot() {
    if (socket && socket.readyState === 1) socket.send(JSON.stringify({ type: "snapshot" }));
  }

  function setConn(on, text) {
    el.dot.className = "dot " + (on ? "on" : "off");
    el.conn.textContent = text;
  }

  function connect() {
    var scheme = location.protocol === "https:" ? "wss:" : "ws:";
    socket = new WebSocket(scheme + "//" + location.host + "/api/runs/" + TOKEN + "/ws");
    socket.onopen = function () { attempt = 0; setConn(true, "接続済み"); };
    socket.onmessage = function (event) {
      try { apply(JSON.parse(event.data)); } catch (error) { console.warn(error); }
    };
    socket.onclose = function () {
      setConn(false, "切断（再接続します）");
      if (status === "deleted") { setConn(false, "削除済み"); return; }
      attempt += 1;
      setTimeout(connect, Math.min(500 * attempt, 5000));
    };
    socket.onerror = function () { socket.close(); };
  }

  el.del.addEventListener("click", function () {
    if (!confirm("この Run を削除します。原稿と逐次ログは復元できません。")) return;
    fetch("/api/runs/" + TOKEN + "/delete", { method: "POST" }).then(function () {
      status = "deleted";
      render();
      setConn(false, "削除済み");
      if (socket) socket.close();
    });
  });

  render();
  connect();
  // 走っている間は定期的に取り直す。push の取りこぼしと、裏のタブでの停止の両方に効く。
  setInterval(function () {
    if (status === "queued" || status === "running") {
      requestSnapshot();
      // 記録が増えなくても経過は進む。止まっていることが画面に出るようにする。
      render();
    }
  }, 5000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) requestSnapshot();
  });
})();
</script>
</body>
</html>
